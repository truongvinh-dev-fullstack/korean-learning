services:
  postgres:
    image: postgres:17-alpine
    container_name: korean_zero_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: korean_zero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korean_zero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: korean_zero_postgres_data
